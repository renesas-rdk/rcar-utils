#Build settings and parameters

# Support platforms
PLATFORM=RCAR-X5H-IRONHIDE

#-----------------------------------------------------------------------------
# Paths
#-----------------------------------------------------------------------------
# Every path below is optional. Left commented out, the build uses the layout
# that common.sh derives from the location of these scripts:
#
#   <rcar-utils>/linux-sh                     kernel source (cloned on demand)
#   <rcar-utils>/workspace/kernel-modules     installed kernel modules
#   <rcar-utils>/workspace/ext-modules        out-of-tree module sources
#   <rcar-utils>/workspace/arm-trusted-firmware
#   <rcar-utils>/workspace/optee              OP-TEE OS source (cloned on demand)
#   <rcar-utils>/workspace/u-boot             U-Boot source (cloned on demand)
#   <rcar-utils>/workspace/initramfs          busybox tree and uInitramfs.cpio.gz
#   <rcar-utils>/workspace/fitimage           FIT inputs and fitImage
#   <rcar-utils>/workspace/downloads          checksum-verified download cache
#
# workspace/ and linux-sh/ are in .gitignore. Uncomment a line below only to
# build somewhere else. They are left commented out rather than assigned an
# empty value on purpose: this file is sourced by the scripts, so an
# assignment - even an empty one - would overwrite the environment. While a
# line stays commented out the same variable can be set per run:
#   KERNEL_MODULES_OUTPUT_DIR=/tmp/mods ./main_build.sh kernel modules-install

# Linux kernel source, <rcar-utils>/linux-sh by default. When it is missing,
# the build offers to clone KERNEL_URL at KERNEL_BRANCH (single branch), then
# checks out KERNEL_SRCREV. The branch moves; KERNEL_SRCREV is the exact
# commit this project has verified end-to-end (see 02_Kernel_Build_GCC_X5H.md
# in the rcar-x5h workspace).
#KERNEL_DIR=
KERNEL_URL=https://github.com/renesas-rcar/linux-bsp.git
KERNEL_BRANCH=v6.12.80/rcar-6.1.0
KERNEL_SRCREV=e1e83b5711610d83941c51dcf48418eda209f339

# Build outputs. WORKSPACE_DIR moves all of them at once; the others override
# one directory each.
#WORKSPACE_DIR=
#KERNEL_MODULES_OUTPUT_DIR=
#EXT_MODULES_SRC_DIR=
#TFA_SRC_DIR=
#OPTEE_SRC_DIR=
#UBOOT_SRC_DIR=
#INITRAMFS_SRC_DIR=
#FIT_OUTPUT_DIR=
#DOWNLOAD_DIR=

#-----------------------------------------------------------------------------
# Out-of-tree kernel modules (ext-modules target)
#-----------------------------------------------------------------------------
# NOT YET PORTED to X5H: this target is stubbed out (see build_ext_modules.sh).
# X5H's GPU IP / out-of-tree driver situation (equivalent of V4H's PowerVR
# Rogue "GSX_KM" DDK, cmem, qos) has not been researched in this project yet.
# The V4H values are left below, commented out, purely as a reference for
# whoever picks this up later - they do NOT apply to X5H as-is.
#CMEM_URL=https://github.com/renesas-rcar/cmem.git
#CMEM_SRCREV=e67f473cddb089f71abead8bf18f618d42f515da
#CMEM_BSIZE=0x20000000
#QOS_URL=https://github.com/renesas-rcar/qos_drv.git
#QOS_SRCREV=72a861aab57e0529b0f24ea2febdaa7afce52fda
#GLES_URL=https://github.com/rcar-community/rcar-gfx/raw/daf8608d920fbf1d179abab8a52cbc0f022c98a1/gfxdrv/GSX_KM_V4H_SparrowHawk.tar.bz2
#GLES_SHA256=f7a4dee2ed239970425728a48f9c4ed1918e1385e23547635811983a95f9306d

# Kernel local version appended to the release string ("uname -r"). Left
# empty on purpose: matches CONFIG_LOCALVERSION of the real `defconfig` this
# project verified (NOT `renesas_defconfig`, which bakes in "-arm64-renesas"
# and is missing CONFIG_RENESAS_ETHER_SWITCH3 - using it breaks the kernel
# link step, see 02_Kernel_Build_GCC_X5H.md).
KERNEL_LOCALVERSION=

# Optional kernel variant: a second kernel built from the same source tree with
# an extra Kconfig fragment merged last, so it can override anything the board
# configuration set. Left commented out so it can be set per run:
#
#   KERNEL_VARIANT=preempt-rt ./scripts/rcar-driver.sh build kernel modules
#
# The fragment is kernel-config/<name>.config. No variant has been verified
# for X5H yet (preempt-rt.config below is still the V4H fragment, unverified
# here) - don't use KERNEL_VARIANT until a fragment is confirmed for X5H.
#KERNEL_VARIANT=

#-----------------------------------------------------------------------------
# ARM Trusted Firmware (bl31 target)
#-----------------------------------------------------------------------------
# X5H's rcar_gen5 TF-A platform is NOT upstream in ARM-software/arm-trusted-
# firmware - it only exists in Renesas's own fork. Revision and build flags
# verified end-to-end in 04_ATF_Build_GCC_X5H.md.
TFA_URL=https://github.com/renesas-rcar/arm-trusted-firmware.git
TFA_SRCREV=c61d3d3e403ebb8993a603a3173dd1b368d78973
# Where apu-bl31-ironhide.{bin,elf,srec} are written.
# Defaults to ${TFA_SRC_DIR}/release.
#TFA_OUTPUT_DIR=

#-----------------------------------------------------------------------------
# OP-TEE OS (optee target) - NOT present in the upstream V4H repo, added for
# X5H because the real boot chain needs it (BL32, between BL31 and U-Boot).
# Fully open source (BSD-2/3-Clause). Revision and build flags verified
# end-to-end in 06_Optee_Build_GCC_X5H.md.
#-----------------------------------------------------------------------------
OPTEE_URL=https://github.com/renesas-rcar/optee_os.git
OPTEE_BRANCH=rcar-gen5_4.4.0
OPTEE_SRCREV=134a538a93f8bdf4d6b068430f7cb38036fa7d33
# Where apu-tee-ironhide.{bin,elf,srec} are written.
#OPTEE_OUTPUT_DIR=

#-----------------------------------------------------------------------------
# U-Boot (uboot target) - NOT present in the upstream V4H repo (that board
# keeps a stock, pre-flashed U-Boot). Added for X5H because this project
# already has a verified from-source build. Revision/defconfig verified
# end-to-end in 03_Uboot_Build_GCC_X5H.md.
#-----------------------------------------------------------------------------
UBOOT_URL=https://github.com/renesas-rcar/u-boot.git
UBOOT_BRANCH=v2026.01/rcar-8.0.0
UBOOT_SRCREV=1a33b2bc6981f2077bc4b0780fa3604c1e20d1a0
UBOOT_DEFCONFIG=r8a78000_ironhide_defconfig
# Where u-boot-elf-ironhide.srec is written.
#UBOOT_OUTPUT_DIR=

#-----------------------------------------------------------------------------
# Initramfs (initramfs target)
#-----------------------------------------------------------------------------
# NOT YET PORTED to X5H: this target is stubbed out (see build_initramfs.sh).
# V4H needs this because its PCIe driver is built as a module
# (CONFIG_PCIE_RCAR_GEN4_HOST=m) and NVMe root needs it loaded before the
# real root is reachable. Whether X5H's PCIe Gen5 IP has the same module-vs-
# builtin situation, and what its driver/firmware is actually named, has not
# been researched in this project. BUSYBOX_URL/SHA256 are generic (not board-
# specific) and left as-is for whoever implements this target.
BUSYBOX_URL=https://busybox.net/downloads/busybox-1.36.1.tar.bz2
BUSYBOX_SHA256=b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314

#-----------------------------------------------------------------------------
# Required firmware blobs (kernel + U-Boot both need these)
#-----------------------------------------------------------------------------
# Unlike V4H's single rcar_gen4_pcie.bin (downloadable from linux-firmware),
# X5H needs 3 blobs that are NOT publicly downloadable - they ship only
# inside the Renesas SDK v4.39.0 package (My Renesas account required):
#   https://www.renesas.com/en/document/mas/sdk-documentation-sdk-v4390
#   -> <SDK v4.39.0>/user_manual/current/linux_bsp/_attachments/
#        rcar_gen5_mp_phy.bin        (kernel CONFIG_EXTRA_FIRMWARE + U-Boot CONFIG_PHY_R8A78000_MP_PHY_FW)
#        rcar_gen5_pcie6_iccm.bin    (kernel CONFIG_EXTRA_FIRMWARE)
#        rcar_gen5_pcie6_dccm.bin    (kernel CONFIG_EXTRA_FIRMWARE)
# Point FW_DIR at a local directory containing these 3 files. There is no URL
# fetch for them - common.sh's install_firmware_blobs fails loudly with the
# instructions above if any are missing, rather than silently skipping them
# (both the kernel and U-Boot builds hard-fail without them - confirmed by
# deliberately removing them and re-building, see 02_/03_Build_GCC_X5H.md).
#FW_DIR=

#-----------------------------------------------------------------------------
# FIT image settings
#-----------------------------------------------------------------------------
# Unlike V4H, X5H's FIT image does NOT contain BL31: on X5H, BL31/OP-TEE/
# U-Boot each run (from separately-flashed raw .srec, see the project's
# Flash_Yocto_Binaries_X5H.md / Table 4-1-2) BEFORE U-Boot is even alive, so
# U-Boot never "loads" BL31 the way V4H's stock U-Boot does via FIT. This
# FIT image only carries the kernel + dtb (+ optional ramdisk) that U-Boot's
# own bootcmd loads directly once it is already running.
#BL31_BIN=     # not used by the X5H fitimage target - kept for reference only

# Initramfs used by the "#initramfs" FIT configuration. Optional: when it is
# missing the fitImage is generated without the "initramfs" configuration.
# Defaults to the image built by the initramfs target (not yet implemented
# for X5H - see above).
#INITRAMFS_CPIO=

# Load addresses, must match the U-Boot environment of the board. These are
# the real addresses already documented and used by this project's own
# bootcmd (01_Yocto_Full_Build_X5H.md Sec.3) - not placeholders.
FIT_KERNEL_LOADADDR=0x9E680000
FIT_DTB_LOADADDR=0x9E600000

# Optional: use a hand-written image tree source instead of the generated one.
#FIT_ITS=
