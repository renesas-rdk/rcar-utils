#Build settings and parameters

# Support platforms
PLATFORM=RCAR-V4H-SH

#-----------------------------------------------------------------------------
# Paths
#-----------------------------------------------------------------------------
# Every path below is optional. Left commented out, the build uses the layout
# that common.sh derives from the location of these scripts:
#
#   <rcar-utils>/linux-sh                     kernel source (cloned on demand)
#   <rcar-utils>/workspace/kernel-modules     installed kernel modules
#   <rcar-utils>/workspace/ext-modules        out-of-tree module sources
#   <rcar-utils>/workspace/arm-trusted-firmware
#   <rcar-utils>/workspace/initramfs          busybox tree and uInitramfs.cpio.gz
#   <rcar-utils>/workspace/fitimage           FIT inputs and fitImage
#   <rcar-utils>/workspace/downloads          checksum-verified download cache
#
# workspace/ and linux-sh/ are in .gitignore. Uncomment a line below only to
# build somewhere else. They are left commented out rather than assigned an
# empty value on purpose: this file is sourced by the scripts, so an
# assignment - even an empty one - would overwrite the environment. While a
# line stays commented out the same variable can be set per run:
#   KERNEL_MODULES_OUTPUT_DIR=/tmp/mods ./main_build.sh kernel modules-install

# Linux kernel source, <rcar-utils>/linux-sh by default. When it is missing,
# the build offers to clone KERNEL_URL at KERNEL_BRANCH (single branch).
#KERNEL_DIR=
KERNEL_URL=https://github.com/renesas-rdk/linux-sh.git
KERNEL_BRANCH=ubuntu/rcar-v4h-sh

# Build outputs. WORKSPACE_DIR moves all of them at once; the others override
# one directory each.
#WORKSPACE_DIR=
#KERNEL_MODULES_OUTPUT_DIR=
#EXT_MODULES_SRC_DIR=
#TFA_SRC_DIR=
#INITRAMFS_SRC_DIR=
#FIT_OUTPUT_DIR=
#DOWNLOAD_DIR=

#-----------------------------------------------------------------------------
# Out-of-tree kernel modules (ext-modules target)
#-----------------------------------------------------------------------------
# Revisions mirror the SRCREVs pinned by the meta-sparrow-hawk recipes; the
# patches live under patches/<name>/.
CMEM_URL=https://github.com/renesas-rcar/cmem.git
CMEM_SRCREV=e67f473cddb089f71abead8bf18f618d42f515da
# cmemdrv reserved size, "options cmemdrv bsize=..." (0x1f000000 when RGID_ON=1)
CMEM_BSIZE=0x20000000

QOS_URL=https://github.com/renesas-rcar/qos_drv.git
QOS_SRCREV=72a861aab57e0529b0f24ea2febdaa7afce52fda

# PowerVR GPU kernel module. Released as a tarball, not a git repository, so
# the revision is the sha256sum the recipe checks.
GLES_URL=https://github.com/rcar-community/rcar-gfx/raw/daf8608d920fbf1d179abab8a52cbc0f022c98a1/gfxdrv/GSX_KM_V4H_SparrowHawk.tar.bz2
GLES_SHA256=f7a4dee2ed239970425728a48f9c4ed1918e1385e23547635811983a95f9306d

# Kernel local version appended to the release string ("uname -r").
# "-arm64-renesas" is the rcar-utils default.
KERNEL_LOCALVERSION=-arm64-renesas

#-----------------------------------------------------------------------------
# ARM Trusted Firmware (bl31 target)
#-----------------------------------------------------------------------------
# Every FIT configuration loads BL31, so it is mandatory. Revision and build
# flags mirror the meta-sparrow-hawk arm-trusted-firmware recipe.
TFA_URL=https://github.com/ARM-software/arm-trusted-firmware.git
TFA_SRCREV=1d5aa939bc8d3d892e2ed9945fa50e36a1a924cc
# Where bl31-sparrow-hawk.{bin,elf,srec} are written.
# Defaults to ${TFA_SRC_DIR}/release.
#TFA_OUTPUT_DIR=

#-----------------------------------------------------------------------------
# Initramfs (initramfs target)
#-----------------------------------------------------------------------------
# Local equivalent of the meta-sparrow-hawk initramfs-image recipe. The image
# only has to load the PCIe driver and switch to the real root, so busybox is
# built statically and glibc is not needed at all.
# Where uInitramfs.cpio.gz is written. Defaults to INITRAMFS_SRC_DIR.
#INITRAMFS_OUTPUT_DIR=

BUSYBOX_URL=https://busybox.net/downloads/busybox-1.36.1.tar.bz2
BUSYBOX_SHA256=b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314

# PCIe PHY firmware. pcie-rcar-gen4 calls request_firmware() while bringing
# the link up, so the blob is needed both inside the initramfs and on the
# rootfs next to the module - it is not part of the distro's linux-firmware
# package. Same file and revision the sparrow-hawk-fw recipe fetches.
PCIE_FW_URL=https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rcar_gen4_pcie.bin?h=20260519
PCIE_FW_SHA256=cad6315e51397e9e2dd401d79eaa873c7b67290bce381bb97728883cc243e5ff
PCIE_FW_LIC_URL=https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/LICENCE.r8a779g_pcie_phy?h=20260519
PCIE_FW_LIC_SHA256=fa0df1c508be531a302823721ae14258ba0481c9b1d717b2d3f2344aa0f66894

#-----------------------------------------------------------------------------
# FIT image settings
#-----------------------------------------------------------------------------
# ARM Trusted Firmware BL31 blob loaded by every FIT configuration. Mandatory.
# Defaults to the blob built by the bl31 target. Set it explicitly to use a
# blob from somewhere else.
#BL31_BIN=

# Initramfs used by the "#initramfs" FIT configuration (boot.cmd selects it
# when the rootfs is not on eMMC/SD). Optional: when it is missing the
# fitImage is generated without the "initramfs" configuration and the board
# can only boot a rootfs on eMMC/SD.
# Defaults to the image built by the initramfs target.
#INITRAMFS_CPIO=

# Load/entry addresses, must match the U-Boot environment of the board.
FIT_KERNEL_LOADADDR=0x50200000
FIT_ATF_LOADADDR=0x46400000

# Optional: use a hand-written image tree source instead of the generated one.
#FIT_ITS=
