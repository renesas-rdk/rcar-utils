####################################
# RZ/V4H Sparrow-Hawk board configurations
####################################

[sparrow-hawk]
ethernet = ["e6800000", "e6810000"]
ethernet_udp_index = "0"
# V4H uses SA0 (renesas-rcar4-sa0 binman etype), not bpgen — spl_dest here is the
# SPL_TEXT_BASE the SA0 header points the CR52/ROM loader to, per u-boot-sst .config.
spl_dest  = "0xEB210000"
fconf_dtb_base = "0x08130000"

# Uload bootloader
flash_address = ["00000", "60000", "5F300"]
load_address = "0x48000000"

# Bootloader flash SPI
# SPL here is the SA0 header + SPL (sa0.bin), FIP is the FIT image (u-boot.itb).
# SPL/FIP = [VMA, flash offset]. FIP offset 0x80000 = CONFIG_SYS_SPI_U_BOOT_OFFS.
# BID offset 0x2C0000 (not the 0x5F300 used by the V2H boards below) — flash.bin's
# SA0+SPL region only spans 0x0-0x61E40ish and FIT sits at 0x80000-0x22AAA7ish, so
# 0x2C0000 is a safe 64KB-sector-aligned gap before PCIE at 0x300000.
#
# NOTE: embedding BL31+OP-TEE directly into u-boot.itb (via extra atf-1/tee-1
# FIT loadable nodes in u-boot-sst's binman definition) was investigated and
# reverted — SPL's spl_fit.c only copies loadables' raw bytes to their `load`
# address, it does not invoke the U_BOOT_FIT_LOADABLE_HANDLER(IH_TYPE_TFA_BL31/
# IH_TYPE_TEE, ...) handlers in board/renesas/common/gen4-common.c (those are
# only called by U-Boot proper's bootm, via fit_loadable_process() in
# boot/image-board.c, e.g. when booting the separate SD-card fitImage used by
# ticket AMECSSTSWA-400). Confirmed on real hardware: with tee-1's `load`
# address colliding with U-Boot's own load address, SPL loaded OP-TEE directly
# on top of the just-loaded U-Boot before jumping to it, hanging the board
# right after "EVTB1 board detected". OP-TEE for Sparrow-Hawk must go through
# the fitImage/SD-card path, not this SPI-NOR FIP. rz-utils does not build or
# flash a fitImage — OP-TEE-enabled images for this board are built and
# flashed outside this tool; see project update docs for details.
[sparrow-hawk.xspi]
SPL = ["EB210000", "00000"]
FIP = ["00000", "80000"]
PCIE = ["300000"]
BID = ["00810", "2C0000"]
# TEE offset — used only with bootloader_flash.py's --image_tee, which is
# skipped entirely when no tee binary is configured/found. Staging-only for
# now: nothing in the current SA0/SPL -> U-Boot proper boot path reads this
# offset (see the NOTE above and README.md's "Where OP-TEE lives for
# Sparrow-Hawk" section).
#
# IMPORTANT: this offset must never collide with any value
# CFG_SPL_PLATFORM_SETTINGS_OFFSET (include/configs/rz-cmn.h in u-boot-sst)
# has EVER held, current or historical, on any IPL build that might still be
# flashed on a board. It was 0x400000 before commit "rz-cmn: fix V4H BID
# boot defaults" moved it to 0x2C0000 (see BID above) — an SPL built before
# that commit (e.g. commit a47a8308e43, still in the wild on at least one
# board seen during bring-up) reads board identification from 0x400000, so
# writing a tee binary there overwrote its board_id/model_string with tee
# data and corrupted boot (confirmed on real hardware: model_id read back
# as garbage, board hung after "Starting kernel ..."). 0x1000000 (16MB) was
# chosen for a large margin from every offset above (SPL/FIP end ~2.7MB,
# BID current+historical at 0x2C0000/0x400000, PCIE at 0x300000), with
# ~48MB of headroom before the 512Mbit (64MB / 0x4000000) total SPI-NOR
# capacity. Re-verify against u-boot-sst's full offset history before ever
# reusing or changing this value.
TEE = ["1000000"]

# Bootloader flash eMMC
[sparrow-hawk.emmc]
SPL = ["1", "1", "8101E00"]
FIP = ["1", "300", "44000000", "2", "8"]
BID = ["1", "2FA", "810"]

# Bootloader flash eSD
[sparrow-hawk.esd]
SPL_BP_ESD = ["1", "1"]
SPL = ["8"]
BID = ["762"]
FIP = ["768"]
